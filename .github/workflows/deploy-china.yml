name: Deploy to China VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: portfolio-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest to previous
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}"
          if docker pull "${IMG}:latest"; then
            docker tag "${IMG}:latest" "${IMG}:previous"
            docker push "${IMG}:previous"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://120.26.45.50
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 6h
          script_stop: true
          envs: GHCR_TOKEN
          script: |
            set -e
            cd ~/Frederick-Aurelio-Halim-Portfolio
            git fetch origin
            git reset --hard origin/main

            OWNER="${{ steps.meta.outputs.owner }}"
            APP="ghcr.io/${OWNER}/portfolio-app"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${OWNER}" --password-stdin

            if docker image inspect "${APP}:latest" >/dev/null 2>&1; then
              docker tag "${APP}:latest" "${APP}:previous"
            elif docker image inspect portfolio-app:latest >/dev/null 2>&1; then
              docker tag portfolio-app:latest "${APP}:previous" || true
            fi

            export DOCKER_CLIENT_TIMEOUT=3600
            export COMPOSE_HTTP_TIMEOUT=3600
            export IMAGE_APP="${APP}:latest"
            docker compose -f docker-compose.yml -f docker-compose.ci.yml pull
            docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

            docker images --format '{{.Repository}}:{{.Tag}}' "$APP" | while read -r ref; do
              case "$ref" in
                *:latest|*:previous) ;;
                *) docker rmi "$ref" || true ;;
              esac
            done
            docker rmi portfolio-app:latest portfolio-app:previous 2>/dev/null || true
            docker image prune -f
            docker container prune -f
            docker logout ghcr.io || true
